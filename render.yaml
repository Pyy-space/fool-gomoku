# Render Blueprint —— 纯 API 后端（真正前后端分离：前端放 GitHub Pages）
#
# 部署要点：
#   * 这是「Web Service」类型（长驻进程），不是「Static Site」。
#   * 根目录 / 仓库根，Python 环境；启动命令见 Procfile。
#   * 免费版 15 分钟无流量会休眠，首次请求会冷启动几十秒。
#   * 环境变量 GOMOKU_LAB_TOKEN 设成你自己的口令，别用默认值。
services:
  - type: web
    name: fool-gomoku
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements-web.txt
    startCommand: python run.py --host 0.0.0.0 --no-browser
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: GOMOKU_LAB_TOKEN
        value: gomoku-lab
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONIOENCODING
        value: utf-8
      - key: PYTHONUTF8
        value: "1"
