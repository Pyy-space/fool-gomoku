<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>对弈 · 惜江悅的小助手</title>
<link rel="stylesheet" href="static/style.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="index.html">
    <span class="mark">◉</span>
    <span>惜江悅的小助手<span class="sub"> 五子棋</span></span>
  </a>
  <nav class="nav">
    <a href="index.html" class="back">‹ 首页</a>
  </nav>
  <div class="conn"><span id="dot" class="dot on"></span><span id="connText">本地引擎</span></div>
  <span id="ver" class="ver" title="版本">v1.0</span>
</header>

<main class="page">
<section class="layout">
  <aside class="panel side">
    <h2>对局设置</h2>
    <label>我执
      <select id="humanColor">
        <option value="1">黑（先手）</option>
        <option value="2">白（后手）</option>
      </select>
    </label>
    <label>难度
      <select id="level">
        <option value="1">1 · 敷衍</option>
        <option value="2" selected>2 · 认真</option>
        <option value="3">3 · 全力</option>
      </select>
    </label>
    <label>棋盘
      <select id="boardSize">
        <option value="15" selected>15 × 15（标准）</option>
        <option value="13">13 × 13</option>
        <option value="19">19 × 19</option>
      </select>
    </label>
    <label>规则
      <select id="rules">
        <option value="casual" selected>无禁手（休闲）</option>
        <option value="renju">连珠（黑方禁手）</option>
      </select>
    </label>
    <div class="row">
      <button id="btnNew" class="primary">开始新局</button>
      <button id="btnUndo">悔棋</button>
    </div>
    <div class="row">
      <button id="btnHint">提示一手</button>
      <button id="btnResign" class="danger">认输</button>
    </div>

    <h2>自我进化</h2>
    <label class="switchrow">
      <input type="checkbox" id="learnToggle" checked>
      <span>下完一局后学习</span>
    </label>
    <div id="learnStatus" class="kv small">学习状态：加载中…</div>
  </aside>

  <div class="panel boardwrap">
    <div class="statusbar">
      <span id="turnBadge" class="badge">—</span>
      <span id="stoneCount" class="muted">0 子</span>
      <span class="spacer"></span>
      <span id="thinking" class="thinking hidden">小助手正在想<span class="dots"></span></span>
    </div>
    <div id="board" class="board"></div>
    <div id="persona" class="persona hidden"></div>
    <div id="result" class="result hidden"></div>
  </div>

  <aside class="panel side">
    <h2>AI 分析</h2>
    <div id="analysis" class="kv small analysis-box">等待落子…</div>
    <h2>最近着法</h2>
    <ol id="moves" class="moves fill"></ol>
    <h2>提示</h2>
    <p class="small muted">
      点击棋盘落子，小助手会自动应手。<br>
      「提示一手」会在棋盘上标一个发光虚影，告诉你想在哪儿下。
    </p>
  </aside>
</section>
</main>

<footer class="foot">纯前端 · 引擎跑在你的浏览器里 · 无需后端</footer>

<script src="config.js"></script>
<script src="static/engine.js"></script>
<script src="static/persona.js"></script>
<script src="static/app.js"></script>
<script>window.PAGE = "local";</script>
</body>
</html>
